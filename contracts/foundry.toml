[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10_000
evm_version = "cancun"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
# Blockscout verification for Robinhood Chain
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

[fmt]
line_length = 120
